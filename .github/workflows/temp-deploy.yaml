name: Temp Deploy
# Reusable workflow for temporary PR deployments
# Copies existing app stack, rewrites image/labels/volumes via Node.js script

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        default: '["ubuntu-latest"]'
        description: "Runner labels as a JSON array"
      home-ops-repo:
        type: string
        default: wajeht/home-ops
      app-path:
        type: string
        required: true
        description: "Base app path (e.g., apps/bang)"
      service-name:
        type: string
        required: true
        description: "Compose service to deploy (e.g., bang)"
      tag:
        type: string
        required: true
        description: "Image tag (e.g., abc1234)"
      auth-middleware:
        type: string
        default: ""
        description: "Optional Traefik middleware for temp routers (e.g., tinyauth@file)"
    secrets:
      DOCKER_CD_URL:
        required: false
        description: "HTTPS docker-cd URL; required when Home Ops contains Tinyauth"
      DOCKER_CD_API_SECRET:
        required: false
        description: "docker-cd API bearer token; required when Home Ops contains Tinyauth"
      GH_TOKEN:
        required: true
        description: "GitHub PAT with repo and packages access"

concurrency:
  group: deploy-home-ops
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      deployments: write
    outputs:
      url: ${{ steps.rewrite.outputs.url }}
    env:
      DOCKER_CD_URL: ${{ secrets.DOCKER_CD_URL }}
      DOCKER_CD_API_SECRET: ${{ secrets.DOCKER_CD_API_SECRET }}
    steps:
      - name: Checkout home-ops
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.home-ops-repo }}
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Checkout deploy workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: wajeht/docker-cd-deploy-workflow
          token: ${{ secrets.GH_TOKEN }}
          path: .deploy-workflow

      - name: Checkout app repo for env overrides
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GH_TOKEN }}
          path: .app-repo
          sparse-checkout: .env.sops
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Install dependencies
        run: cd .deploy-workflow && npm ci

      - name: Request deployment
        id: deployment
        run: |
          node .deploy-workflow/src/deployment.js \
            --action request \
            --token "${{ github.token }}" \
            --repo "${{ github.repository }}" \
            --environment "pr-${{ github.event.pull_request.number }}" \
            --ref "${{ github.event.pull_request.head.sha }}"

      - name: Register and push preview
        id: rewrite
        run: |
          node .deploy-workflow/src/temp-push.js \
            --action deploy \
            --message "chore(${{ github.event.repository.name }}): temp deploy pr-${{ github.event.pull_request.number }} @ ${{ inputs.tag }}" \
            --app-path "${{ inputs.app-path }}" \
            --service-name "${{ inputs.service-name }}" \
            --tag "${{ inputs.tag }}" \
            --pr-number "${{ github.event.pull_request.number }}" \
            --repo-owner "${{ github.repository_owner }}" \
            --auth-middleware "${{ inputs.auth-middleware }}" \
            --app-repo-path .app-repo

      - name: Wait for preview and Tinyauth deployment
        if: steps.rewrite.outputs.auth-managed == 'true'
        run: |
          node .deploy-workflow/src/wait-preview.js \
            --app-path "${{ inputs.app-path }}" \
            --pr-number "${{ github.event.pull_request.number }}" \
            --commit "${{ steps.rewrite.outputs.commit }}"

      - name: Mark deployment success
        run: |
          node .deploy-workflow/src/deployment.js \
            --action deploy \
            --token "${{ github.token }}" \
            --repo "${{ github.repository }}" \
            --environment "pr-${{ github.event.pull_request.number }}" \
            --deployment-id "${{ steps.deployment.outputs.deployment-id }}" \
            --url "${{ steps.rewrite.outputs.url }}" \
            --verified "${{ steps.rewrite.outputs.auth-managed }}"

      - name: Mark deployment failed
        if: failure() && steps.deployment.outputs.deployment-id != ''
        run: |
          node .deploy-workflow/src/deployment.js \
            --action failure \
            --token "${{ github.token }}" \
            --repo "${{ github.repository }}" \
            --environment "pr-${{ github.event.pull_request.number }}" \
            --deployment-id "${{ steps.deployment.outputs.deployment-id }}"

      - name: Cleanup workflow scripts
        if: always()
        run: rm -rf .deploy-workflow .app-repo
