name: Temp Deploy
# Reusable workflow for temporary PR deployments
# Copies existing app stack, rewrites image/labels/volumes via Node.js script

on:
  workflow_call:
    inputs:
      home-ops-repo:
        type: string
        default: wajeht/home-ops
      app-path:
        type: string
        required: true
        description: "Base app path (e.g., apps/bang)"
      service-name:
        type: string
        required: true
        description: "Compose service to deploy (e.g., bang)"
      tag:
        type: string
        required: true
        description: "Image tag (e.g., abc1234)"
      auth-middleware:
        type: string
        default: ""
        description: "Optional Traefik middleware for temp routers (e.g., oauth2-admin@file)"
    secrets:
      GH_TOKEN:
        required: true
        description: "GitHub PAT with repo and packages access"

concurrency:
  group: deploy-home-ops
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      deployments: write
    outputs:
      url: ${{ steps.rewrite.outputs.url }}
    steps:
      - name: Checkout home-ops
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ inputs.home-ops-repo }}
          token: ${{ secrets.GH_TOKEN }}

      - name: Checkout deploy workflow scripts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: wajeht/docker-cd-deploy-workflow
          token: ${{ secrets.GH_TOKEN }}
          path: .deploy-workflow

      - name: Checkout app repo for env overrides
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GH_TOKEN }}
          path: .app-repo
          sparse-checkout: .env.sops
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26

      - name: Install dependencies
        run: cd .deploy-workflow && npm ci

      - name: Request deployment
        id: deployment
        run: |
          node .deploy-workflow/src/deployment.js \
            --action request \
            --token "${{ github.token }}" \
            --repo "${{ github.repository }}" \
            --environment "pr-${{ github.event.pull_request.number }}" \
            --ref "${{ github.event.pull_request.head.sha }}"

      - name: Rewrite compose for temp deploy
        id: rewrite
        run: |
          node .deploy-workflow/src/temp-compose.js \
            --app-path "${{ inputs.app-path }}" \
            --service-name "${{ inputs.service-name }}" \
            --tag "${{ inputs.tag }}" \
            --pr-number "${{ github.event.pull_request.number }}" \
            --repo-owner "${{ github.repository_owner }}" \
            --auth-middleware "${{ inputs.auth-middleware }}" \
            --app-repo-path .app-repo

      - name: Commit and push
        run: |
          node .deploy-workflow/src/git-push.js \
            --paths "${{ inputs.app-path }}-pr-${{ github.event.pull_request.number }}" \
            --message "chore(${{ github.event.repository.name }}): temp deploy pr-${{ github.event.pull_request.number }} @ ${{ inputs.tag }}"

      - name: Mark deployment success
        run: |
          node .deploy-workflow/src/deployment.js \
            --action deploy \
            --token "${{ github.token }}" \
            --repo "${{ github.repository }}" \
            --environment "pr-${{ github.event.pull_request.number }}" \
            --deployment-id "${{ steps.deployment.outputs.deployment-id }}" \
            --url "${{ steps.rewrite.outputs.url }}"

      - name: Cleanup workflow scripts
        run: rm -rf .deploy-workflow .app-repo
