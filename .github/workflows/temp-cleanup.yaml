name: Temp Cleanup
# Reusable workflow to remove temporary PR deployments

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        default: '["ubuntu-latest"]'
        description: "Runner labels as a JSON array"
      home-ops-repo:
        type: string
        default: wajeht/home-ops
      app-path:
        type: string
        required: true
        description: "Base app path (e.g., apps/bang)"
    secrets:
      DOCKER_CD_URL:
        required: false
        description: "HTTPS docker-cd URL; required when Home Ops contains Tinyauth"
      DOCKER_CD_API_SECRET:
        required: false
        description: "docker-cd API bearer token; required when Home Ops contains Tinyauth"
      GH_TOKEN:
        required: true
        description: "GitHub PAT with repo and packages access"

concurrency:
  group: deploy-home-ops
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    permissions:
      deployments: write
    env:
      DOCKER_CD_URL: ${{ secrets.DOCKER_CD_URL }}
      DOCKER_CD_API_SECRET: ${{ secrets.DOCKER_CD_API_SECRET }}
    steps:
      - name: Checkout home-ops
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.home-ops-repo }}
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Checkout deploy workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: wajeht/docker-cd-deploy-workflow
          token: ${{ secrets.GH_TOKEN }}
          path: .deploy-workflow

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Install dependencies
        run: cd .deploy-workflow && npm ci

      - name: Remove preview and access rule
        id: cleanup
        run: |
          node .deploy-workflow/src/temp-push.js \
            --action cleanup \
            --app-path "${{ inputs.app-path }}" \
            --pr-number "${{ github.event.pull_request.number }}" \
            --message "chore(${{ github.event.repository.name }}): remove temp deploy pr-${{ github.event.pull_request.number }}"

      - name: Wait for preview and access rule removal
        if: steps.cleanup.outputs.auth-managed == 'true'
        run: |
          node .deploy-workflow/src/wait-preview.js \
            --app-path "${{ inputs.app-path }}" \
            --pr-number "${{ github.event.pull_request.number }}" \
            --commit "${{ steps.cleanup.outputs.commit }}" \
            --cleanup

      - name: Cleanup GitHub deployment
        run: |
          node .deploy-workflow/src/deployment.js \
            --action cleanup \
            --token "${{ github.token }}" \
            --repo "${{ github.repository }}" \
            --environment "pr-${{ github.event.pull_request.number }}"

      - name: Cleanup workflow scripts
        if: always()
        run: rm -rf .deploy-workflow
