name: Deploy
# Reusable workflow for docker-cd deployments

on:
  workflow_call:
    inputs:
      home-ops-repo:
        type: string
        default: wajeht/home-ops
      app-path:
        type: string
        required: true
        description: "Path to docker-compose.yml (e.g., apps/ufc)"
      service-name:
        type: string
        required: true
        description: "Compose service to update (e.g., ufc)"
      tag:
        type: string
        required: true
        description: "Image tag (e.g., v0.1.2)"
      url:
        type: string
        description: "Production URL (defaults to <repo-name>.jaw.dev)"
    secrets:
      GH_TOKEN:
        required: true
        description: "GitHub PAT with repo and packages access"

concurrency:
  group: deploy-home-ops
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ inputs.url || format('https://{0}.jaw.dev', github.event.repository.name) }}
    steps:
      - name: Checkout home-ops
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ inputs.home-ops-repo }}
          token: ${{ secrets.GH_TOKEN }}

      - name: Checkout deploy workflow scripts
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: wajeht/docker-cd-deploy-workflow
          token: ${{ secrets.GH_TOKEN }}
          path: .deploy-workflow

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26

      - name: Install dependencies
        run: cd .deploy-workflow && npm ci

      - name: Resolve image digest
        id: digest
        run: |
          echo "${{ secrets.GH_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):${{ inputs.tag }}"
          digest=$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Update image tag
        run: |
          node .deploy-workflow/src/update-tag.js \
            --app-path "${{ inputs.app-path }}" \
            --service-name "${{ inputs.service-name }}" \
            --tag "${{ inputs.tag }}" \
            --repo "${{ github.repository }}" \
            --digest "${{ steps.digest.outputs.digest }}"

      - name: Commit and push
        run: |
          node .deploy-workflow/src/git-push.js \
            --paths "${{ inputs.app-path }}/docker-compose.yml" \
            --message "chore(${{ github.event.repository.name }}): update to ${{ inputs.tag }}"

      - name: Cleanup workflow scripts
        run: rm -rf .deploy-workflow
