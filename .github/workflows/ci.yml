name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | sed -n '2p')
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi
          REPO="https://github.com/${{ github.repository }}"
          BODY=""
          declare -A SECTIONS
          declare -a ORDER
          while IFS='|' read -r MSG SHORTHASH FULLHASH AUTHOR; do
            [ -z "$MSG" ] && continue
            TYPE=$(echo "$MSG" | sed -n 's/^\([a-z]*\)\(([^)]*)\)\?: .*/\1/p')
            [ -z "$TYPE" ] && TYPE="other"
            STRIPPED=$(echo "$MSG" | sed 's/^[a-z]*([^)]*): //;s/^[a-z]*: //')
            LINE="- ${STRIPPED} ([${SHORTHASH}](${REPO}/commit/${FULLHASH})) @${AUTHOR}"
            if [ -z "${SECTIONS[$TYPE]+x}" ]; then
              ORDER+=("$TYPE")
            fi
            SECTIONS[$TYPE]="${SECTIONS[$TYPE]}${LINE}"$'\n'
          done <<< "$(git log "$RANGE" --pretty=format:"%s|%h|%H|%an" --no-merges)"
          for TYPE in "${ORDER[@]}"; do
            BODY="${BODY}### ${TYPE}"$'\n'"${SECTIONS[$TYPE]}"$'\n'
          done
          {
            echo "body<<EOF"
            echo "## What's Changed"
            echo "$BODY"
            echo "**Full Changelog**: ${REPO}/compare/${PREV_TAG}...${GITHUB_REF#refs/tags/}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body: ${{ steps.changelog.outputs.body }}
          tag_name: ${{ github.ref_name }}
